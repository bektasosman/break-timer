<div class="timer-card">
  <!-- Quick-Actions oben rechts (Glas-Look) -->
  <div class="timer-card-icons">
    <a routerLink="/stats" class="icon-action-btn" title="Statistiken ansehen" aria-label="Statistiken">
      <span class="btn-icon">📊</span>
    </a>
    <a routerLink="/config" class="icon-action-btn gear-btn" title="Einstellungen öffnen" aria-label="Einstellungen">
      <span class="btn-icon">⚙️</span>
    </a>
  </div>
  
  <!-- Das Tab-Menü oben -->
  <div class="timer-tabs">
    <button type="button" [class.active]="activeTab() === 'work'" (click)="switchTab('work')">Work</button>
    <button type="button" [class.active]="activeTab() === 'break'" (click)="switchTab('break')">Break</button>
  </div>

  <!-- Die Zeitanzeige -->
  <div class="timer-display">
    <h1 class="time">{{ displayTime() }}</h1>
  </div>

  <!-- Die Buttons unten -->
  <div class="timer-actions">
    <button type="button" class="btn btn-toggle" (click)="toggleTimer()">
      {{ status() === 'RUNNING' ? 'Pause' : (status() === 'PAUSED' ? 'Weiter' : 'Start') }}
    </button>
    
    <button type="button" class="btn btn-skip" (click)="skipSession()" title="Session überspringen">
      ⏭ Skip
    </button>
  </div>
</div>
