<div class="timer-card">
  <!-- Obere Leiste: Links Einstellungen, Mitte Work/Break Tabs, Rechts Stats & Community -->
  <div class="timer-card-header">
    <div class="header-left">
      <a routerLink="/config" class="icon-action-btn gear-btn" title="Einstellungen" aria-label="Einstellungen">
        <span class="btn-icon">⚙️</span>
      </a>
    </div>

    <div class="timer-tabs">
      <button type="button" [class.active]="activeTab() === 'work'" (click)="switchTab('work')">Work</button>
      <button type="button" [class.active]="activeTab() === 'break'" (click)="switchTab('break')">Break</button>
    </div>

    <div class="header-right">
      <a routerLink="/stats" class="icon-action-btn" title="Meine Statistiken" aria-label="Statistiken">
        <span class="btn-icon">📊</span>
      </a>
      <a routerLink="/community" class="icon-action-btn" title="Community Insights" aria-label="Community">
        <span class="btn-icon">🌍</span>
      </a>
    </div>
  </div>

  <!-- Die Zeitanzeige -->
  <div class="timer-display">
    <h1 class="time">{{ displayTime() }}</h1>
  </div>

  <!-- Die Buttons unten -->
  <div class="timer-actions">
    <button type="button" class="btn btn-toggle" (click)="toggleTimer()">
      {{ status() === 'RUNNING' ? 'Pause' : (status() === 'PAUSED' ? 'Weiter' : 'Start') }}
    </button>
    
    <button type="button" class="btn btn-skip" (click)="skipSession()" title="Session überspringen">
      ⏭ Skip
    </button>
  </div>

  <!-- Social Proof Live Badge -->
  <a routerLink="/community" class="social-proof-badge" title="Community Live-Insights ansehen">
    <span class="live-pulse-dot"></span>
    <span class="badge-text">
      @if (globalSessionsCount() > 0) {
        <strong>{{ globalSessionsCount() }}</strong> Fokus-Sessions weltweit aktiv
      } @else {
        Live Community aktiv
      }
    </span>
    <span class="badge-arrow">→</span>
  </a>
</div>
