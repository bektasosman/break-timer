<div class="timer-card">
  <!-- Icons oben rechts in der Box -->
  <div class="timer-card-icons">
    <button class="icon-btn" routerLink="/stats" title="Statistik & Arbeitszeiten">
      📊
    </button>
    <button class="icon-btn icon-btn-gear" routerLink="/config" title="Einstellungen">
      ⚙️
    </button>
  </div>
  
  <!-- Das Tab-Menü oben -->
  <div class="timer-tabs">
    <button [class.active]="activeTab() === 'work'" (click)="switchTab('work')">Work</button>
    <button [class.active]="activeTab() === 'break'" (click)="switchTab('break')">Break</button>
  </div>

  <!-- Die Zeitanzeige -->
  <div class="timer-display">
    <h1 class="time">{{ displayTime() }}</h1>
  </div>

  <!-- Die Buttons unten -->
  <div class="timer-actions">
    <button class="btn btn-toggle" (click)="toggleTimer()">
      {{ status() === 'RUNNING' ? 'Pause' : (status() === 'PAUSED' ? 'Weiter' : 'Start') }}
    </button>
    
    <button class="btn btn-skip" (click)="skipSession()">
      ⏭️ Skip
    </button>
  </div>
</div>
