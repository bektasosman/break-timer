<!-- Die Klasse wechselt dynamisch zwischen 'theme-work' und 'theme-break' -->
<div class="timer-card" [class.theme-work]="activeTab() === 'work'" [class.theme-break]="activeTab() === 'break'">
  
  <!-- Das Tab-Menü oben -->
  <div class="timer-tabs">
    <button [class.active]="activeTab() === 'work'" (click)="switchTab('work')">Work</button>
    <button [class.active]="activeTab() === 'break'" (click)="switchTab('break')">Break</button>
  </div>

  <!-- Die Zeitanzeige -->
  <div class="timer-display">
    <h1 class="time">{{ displayTime() }}</h1>
  </div>

  <!-- Die neuen Buttons unten -->
  <div class="timer-actions">
    <!-- Kombi-Button: Wechselt Text je nach Status -->
    <button class="btn btn-toggle" (click)="toggleTimer()">
      {{ status() === 'RUNNING' ? 'Pause' : 'Start' }}
    </button>
    
    <!-- Skip Button daneben -->
    <button class="btn btn-skip" (click)="skipSession()">
      ⏭ Skip
    </button>

    <button class="btn btn-configure" routerLink="/config">Configure</button>
  </div>
</div>
