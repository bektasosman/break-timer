<header class="navbar">
  <nav class="nav-links">
    <a routerLink="/timer">Timer</a>
    <a routerLink="/config">Einstellungen</a>
  </nav>

  <div class="auth-status">
  @if (authService.isLoggedIn()) {
    <span>Eingeloggt als {{ authService.currentUser() }}</span>
    <button (click)="onLogout()">Abmelden</button>
  } @else {
    <span>Status: Gast</span>
    <a routerLink="/login">Anmelden</a>
  }
</div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
