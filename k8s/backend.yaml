apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: backend
  template: 
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: break-timer-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
           - name: SPRING_DATASOURCE_URL
             value: "jdbc:postgresql://postgres:5432/timer_db"
           - name: SPRING_DATASOURCE_USERNAME
             value: "postgres"
           - name: SPRING_DATASOURCE_PASSWORD
             value: "postgres"
           - name: APP_KAFKA_ENABLED
             value: "false"
---
apiVersion: v1
kind: Service
metadata: 
  name: backend
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports: 
    - port: 8080
      targetPort: 8080
   








