spring.application.name=break.time.reminder
server.port=${PORT:8080}

# Datenbank-Konfiguration
# Auf Render kann über Environment Variable die interne Render-DB URL übergeben werden
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-daduhgv40ujc73d1s370-a.frankfurt-postgres.render.com/timer_db_bjmc?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:timer_db_bjmc_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:xsx1fhRid0dmhHRZZaqXGYWwYe6PXbfC}
spring.jpa.hibernate.ddl-auto=update

# JWT Secret
jwt.secret=${JWT_SECRET:lokaler_test_schluessel_fuer_jwt_signatur_12345}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Kafka Schalter: Standardmäßig TRUE (für deine lokale Entwicklung).
# Auf Render wird die Environment Variable APP_KAFKA_ENABLED=false gesetzt.
app.kafka.enabled=${APP_KAFKA_ENABLED:true}

# Kafka Konfiguration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer: Wandelt unser Java-Objekt in JSON um
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer: Liest JSON und wandelt es zurück in Java-Objekte
spring.kafka.consumer.group-id=timer-tracking-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bektasosman.breaktimer.*
